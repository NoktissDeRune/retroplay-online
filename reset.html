<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Nouveau mot de passe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header injecté dynamiquement -->
  <div id="header-container"></div>

  <main>
    <div class="login-container">
      <h2 style="margin-bottom: 1.5rem; text-align: center; color: white;">Nouveau mot de passe</h2>

      <form id="reset-form" class="login-form is-hidden">
        <input type="password" id="password" class="login-input" placeholder="Nouveau mot de passe (8 caractères min.)" required>
        <input type="password" id="password-confirm" class="login-input" placeholder="Confirme le mot de passe" required>
        <button type="submit" class="login-btn">Enregistrer</button>
      </form>

      <div id="error-msg">Vérification du lien...</div>

      <div class="auth-link">
        <a href="forgot.html">Demander un nouveau lien</a> · <a href="login.html">Connexion</a>
      </div>
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/components.js"></script>

  <script>
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('error-msg');
    let pret = false;

    function afficherFormulaire() {
      pret = true;
      form.classList.remove('is-hidden');
      msg.style.color = '';
      msg.textContent = '';
    }

    // Supabase détecte le lien du mail et déclenche cet évènement
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') afficherFormulaire();
    });

    // Filet de sécurité : si aucun évènement n'arrive, on regarde s'il y a une session
    setTimeout(async () => {
      if (pret) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        afficherFormulaire();
      } else {
        msg.textContent = 'Lien invalide ou expiré. Refais une demande de réinitialisation.';
      }
    }, 1500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const mdp = document.getElementById('password').value;
      const confirmation = document.getElementById('password-confirm').value;

      msg.style.color = '';
      if (mdp.length < 8) {
        msg.textContent = 'Le mot de passe doit faire au moins 8 caractères.';
        return;
      }
      if (mdp !== confirmation) {
        msg.textContent = 'Les deux mots de passe ne correspondent pas.';
        return;
      }

      msg.textContent = 'Enregistrement...';
      const { error } = await supabaseClient.auth.updateUser({ password: mdp });

      if (error) {
        msg.textContent = 'Erreur : ' + error.message;
        return;
      }

      msg.style.color = '#22c55e';
      msg.textContent = 'Mot de passe modifié ! Redirection...';
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    });
  </script>
</body>
</html>
