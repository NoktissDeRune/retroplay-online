<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">RetroPlay — Jouer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styles spécifiques au mode Cinéma / Player */
    .player-container {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--bg-card);
      color: var(--text-main);
      text-decoration: none;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: var(--bg-hover);
    }

    .screen-box {
      width: 100%;
      height: 600px;
      max-height: 75vh;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .game-details {
      margin-top: 1.5rem;
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .game-details h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      🎮 Retro<span>Play</span>
    </a>
  </header>

  <main class="player-container">
    <div class="player-header">
      <a href="index.html" class="btn-back">← Retour au catalogue</a>
    </div>

    <!-- Zone de l'émulateur -->
    <div class="screen-box">
      <div id="game-wrapper" style="width:100%; height:100%;">
        <div id="game"></div>
      </div>
    </div>

    <!-- Informations sur le jeu -->
    <div class="game-details">
      <h1 id="game-title-display">Chargement... <span id="game-badge-display" class="badge"></span></h1>
      <p id="game-desc-display" style="color: var(--text-muted);"></p>
    </div>
  </main>

  <script src="js/player.js"></script>
</body>
</html>
