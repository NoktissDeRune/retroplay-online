<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayRetro — Catalogue Dynamique</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>RetroPlay</h1>
        <p>Sélectionne un jeu pour lancer l'émulateur</p>
    </header>

    <!-- La grille de jeux générée automatiquement -->
    <div id="games-grid" class="games-grid">
        <p class="placeholder-text">Chargement des jeux...</p>
    </div>

    <!-- Zone de l'émulateur -->
    <div id="game-wrapper">
        <div id="game">
            <span class="placeholder-text">Clique sur un jeu pour commencer</span>
        </div>
    </div>

    <!-- Script de l'application -->
    <script src="js/app.js"></script>
</body>
</html>
