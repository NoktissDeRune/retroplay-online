<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Jeux Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header injecté dynamiquement -->
  <div id="header-container"></div>

  <main style="padding: 3rem 0;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 2rem; margin-bottom: 2rem;">
      <h1 class="section-title">Pépites & Jeux Web</h1>
      <p style="color: var(--text-muted);">Une sélection de superbes plateformes et jeux jouables directement sur le web.</p>
    </div>

    <div id="web-games-grid" class="web-games-grid">
      <!-- Chargé dynamiquement par JS -->
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>

  <!-- Script de gestion du Header dynamique -->
  <script src="js/components.js"></script>

<script>
    async function loadWebGames() {
      const grid = document.getElementById('web-games-grid');
      if (!grid) return;
      
      const { data: links, error } = await supabaseClient
        .from('web_links')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = '<p style="color: #ef4444; padding: 0 2rem;">Erreur lors du chargement des liens.</p>';
        return;
      }

      if (!links || links.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); padding: 0 2rem;">Aucun lien web pour le moment.</p>';
        return;
      }

      grid.innerHTML = '';
      links.forEach(link => {
        const card = document.createElement('div');
        card.className = 'web-card';
        card.innerHTML = `
          <div class="web-card-content">
            <h3>${escapeHtml(link.title)}</h3>
            <p>${escapeHtml(link.description || 'Découvrir ce site de jeux en ligne.')}</p>
          </div>
          <a href="${escapeHtml(urlSure(link.url))}" target="_blank" rel="noopener noreferrer" class="btn-visit">
            <span>Visiter le site</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
          </a>
        `;
        grid.appendChild(card);
      });
    }

    loadWebGames();
  </script>
</body>
</html>
