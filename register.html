<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Inscription</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header injecté automatiquement -->
  <div id="header-container"></div>

  <main>
    <div class="auth-container">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Créer un compte</h2>
      
      <form id="register-form" class="auth-form">
        <input type="email" id="email" class="auth-input" placeholder="Ton email" required>
        <input type="password" id="password" class="auth-input" placeholder="Ton mot de passe (min. 6 caractères)" required>
        <button type="submit" class="auth-btn">S'inscrire</button>
        <div id="error-msg"></div>
      </form>

      <div class="auth-link">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  
  <!-- Script de gestion du Header et des composants globaux -->
  <script src="js/components.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      errorDiv.textContent = 'Création du compte en cours...';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        if (error.message.includes('already registered')) {
          errorDiv.textContent = 'Erreur : Cet email est déjà utilisé.';
        } else {
          errorDiv.textContent = 'Erreur : ' + error.message;
        }
      } else {
        errorDiv.style.color = '#22c55e';
        errorDiv.textContent = 'Compte créé avec succès ! Redirection...';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
