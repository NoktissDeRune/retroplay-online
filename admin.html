<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Administration</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 3rem auto;
      background: var(--bg-card, #1e293b);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: white;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid #475569;
      padding-bottom: 1rem;
    }
    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .admin-input, .admin-textarea {
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .admin-textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn-submit {
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #16a34a;
    }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout:hover {
      background: #dc2626;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    th {
      color: #94a3b8;
    }
    .btn-delete {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header class="main-header">
  <div class="header-left">
    <a href="index.html" class="logo">
      🎮 Retro<span>Play</span>
    </a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Catalogue</a>
      <a href="ports.html" class="nav-link">🕹️ Arcade Web</a>
    </nav>
  </div>

  <div class="header-right" id="auth-nav">
    <!-- Injecté dynamiquement par JavaScript (Connexion / Inscription / Admin / Profil) -->
  </div>
</header>

  <main>
    <div class="admin-container">
      <div class="admin-header">
        <h2>Tableau de bord Admin</h2>
        <button id="logout-btn" class="btn-logout">Déconnexion</button>
      </div>

      <!-- Formulaire d'ajout de jeu -->
      <h3>Ajouter un nouveau jeu</h3>
      <form id="add-game-form" class="admin-form">
        <div class="form-group">
          <label for="title">Titre du jeu</label>
          <input type="text" id="title" class="admin-input" placeholder="ex: Super Mario World" required>
        </div>

        <div class="form-group">
          <label for="console">Console (ex: gba, gb, n64)</label>
          <input type="text" id="console" class="admin-input" placeholder="gba" required>
        </div>

        <div class="form-group">
          <label for="rom_url">URL de la ROM (.zip/.gba)</label>
          <input type="text" id="rom_url" class="admin-input" placeholder="roms/<console>/<nom>" required>
        </div>

        <div class="form-group">
          <label for="cover_url">URL de la jaquette (Image)</label>
          <input type="text" id="cover_url" class="admin-input" placeholder="covers/" required>
        </div>

        <div class="form-group">
          <label for="description">Description courte</label>
          <textarea id="description" class="admin-textarea" placeholder="Description du jeu..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Publier le jeu</button>
      </form>

      <!-- Liste des jeux existants pour gestion rapide -->
      <h3>Catalogue actuel</h3>
      <table id="admin-games-table">
        <thead>
          <tr>
            <th>Titre</th>
            <th>Console</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Injecté par JS -->
        </tbody>
      </table>

      <!-- Formulaire d'ajout de lien web -->
      <h3 style="margin-top: 2rem;">Ajouter une pépite Web</h3>
      <form id="add-web-link-form" class="admin-form">
        <div class="form-group">
          <label for="web-title">Nom du site / jeu</label>
          <input type="text" id="web-title" class="admin-input" placeholder="ex: Classic Reload" required>
        </div>

        <div class="form-group">
          <label for="web-url">URL du site</label>
          <input type="url" id="web-url" class="admin-input" placeholder="https://..." required>
        </div>

        <div class="form-group">
          <label for="web-description">Description rapide</label>
          <textarea id="web-description" class="admin-textarea" placeholder="Pourquoi ce site est cool..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Ajouter le lien Web</button>
      </form>

      <!-- Liste des liens web existants -->
      <h3>Liens Web actuels</h3>
      <table id="admin-web-table">
        <thead>
          <tr>
            <th>Titre</th>
            <th>URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Injecté par JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    // Vérification de la session à l'ouverture de la page
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        // Rediriger vers le login si non connecté
        window.location.href = 'login.html';
      } else {
        loadAdminGames();
        loadAdminWebLinks()
      }
    }

    // Gestion de la déconnexion
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // Charger les jeux dans le tableau admin
    async function loadAdminGames() {
      const { data: games, error } = await supabaseClient
        .from('games')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.querySelector('#admin-games-table tbody');
      tbody.innerHTML = '';

      if (error) {
        console.error('Erreur chargement:', error);
        return;
      }

      games.forEach(game => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${game.title}</td>
          <td>${game.console.toUpperCase()}</td>
          <td><button class="btn-delete" onclick="deleteGame('${game.id}')">Supprimer</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Ajouter un jeu
    document.getElementById('add-game-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newGame = {
        title: document.getElementById('title').value,
        console: document.getElementById('console').value.toLowerCase(),
        rom_url: document.getElementById('rom_url').value,
        cover_url: document.getElementById('cover_url').value,
        description: document.getElementById('description').value,
      };

      const { error } = await supabaseClient
        .from('games')
        .insert([newGame]);

      if (error) {
        alert('Erreur lors de l\'ajout : ' + error.message);
      } else {
        alert('Jeu ajouté avec succès !');
        document.getElementById('add-game-form').reset();
        loadAdminGames();
      }
    });

    // Supprimer un jeu
    async function deleteGame(id) {
      if (!confirm('Voulez-vous vraiment supprimer ce jeu ?')) return;

      const { error } = await supabaseClient
        .from('games')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Erreur lors de la suppression : ' + error.message);
      } else {
        loadAdminGames();
      }
    }

    // --- Gestion des liens Web dans l'Admin ---
    async function loadAdminWebLinks() {
      const { data: links, error } = await supabaseClient
        .from('web_links')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.querySelector('#admin-web-table tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (error) {
        console.error('Erreur chargement liens web:', error);
        return;
      }

      links.forEach(link => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${link.title}</td>
          <td><a href="${link.url}" target="_blank" style="color: #3b82f6;">${link.url}</a></td>
          <td><button class="btn-delete" onclick="deleteWebLink('${link.id}')">Supprimer</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('add-web-link-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newLink = {
        title: document.getElementById('web-title').value,
        url: document.getElementById('web-url').value,
        description: document.getElementById('web-description').value,
      };

      const { error } = await supabaseClient
        .from('web_links')
        .insert([newLink]);

      if (error) {
        alert('Erreur lors de l\'ajout : ' + error.message);
      } else {
        alert('Lien web ajouté avec succès !');
        document.getElementById('add-web-link-form').reset();
        loadAdminWebLinks();
      }
    });

    async function deleteWebLink(id) {
      if (!confirm('Voulez-vous vraiment supprimer ce lien ?')) return;

      const { error } = await supabaseClient
        .from('web_links')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Erreur lors de la suppression : ' + error.message);
      } else {
        loadAdminWebLinks();
      }
    }

    // Lancer la vérification au chargement
    checkAuth();
  </script>
</body>
</html>
