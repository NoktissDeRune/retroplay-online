<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Inscription</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 5rem auto;
      background: var(--bg-card, #1e293b);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: white;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .auth-input {
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .auth-btn {
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-btn:hover {
      background: #2563eb;
    }
    #error-msg {
      color: #ef4444;
      font-size: 0.875rem;
      text-align: center;
    }
    .auth-link {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .auth-link a {
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      🎮 Retro<span>Play</span>
    </a>
  </header>

  <main>
    <div class="auth-container">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Créer un compte</h2>
      
      <form id="register-form" class="auth-form">
        <input type="email" id="email" class="auth-input" placeholder="Ton email" required>
        <input type="password" id="password" class="auth-input" placeholder="Ton mot de passe (min. 6 caractères)" required>
        <button type="submit" class="auth-btn">S'inscrire</button>
        <div id="error-msg"></div>
      </form>

      <div class="auth-link">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      errorDiv.textContent = 'Création du compte en cours...';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        errorDiv.textContent = 'Erreur : ' + error.message;
      } else {
        errorDiv.style.color = '#22c55e';
        errorDiv.textContent = 'Compte créé avec succès ! Redirection...';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
