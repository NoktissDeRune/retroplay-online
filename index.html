<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Vos jeux rétro en ligne</title>
  <meta name="description" content="Jouez à vos jeux rétro préférés directement dans votre navigateur. GBA, N64, GBC et plus encore !">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      🎮 Retro<span>Play</span>
    </a>
  </header>

  <main>
    <section class="controls-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Rechercher un jeu (ex: Pokémon, Zelda)...">
      <div id="filters-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="filter-btn active" data-console="all">Tous</button>
        <button class="filter-btn" data-console="gba">GBA</button>
        <button class="filter-btn" data-console="gb">GBC / GB</button>
        <button class="filter-btn" data-console="n64">N64</button>
      </div>
    </section>

    <section id="games-grid" class="games-grid">
      <!-- Les cartes de jeux seront injectées ici par js/app.js -->
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
