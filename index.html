<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Vos jeux rétro en ligne</title>
  <meta name="description" content="Jouez à vos jeux rétro préférés directement dans votre navigateur. GBA, N64, GBC et plus encore !">

  <!-- Open Graph / Facebook / Discord / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://noktissderune.github.io/retroplay-online/">
  <meta property="og:title" content="RetroPlay — Vos jeux rétro en ligne">
  <meta property="og:description" content="Jouez gratuitement à vos jeux rétro préférés (GBA, N64, GBC) directement dans votre navigateur. Sauvegardes et manettes supportées !">
  <meta property="og:image" content="https://noktissderune.github.io/retroplay-online/assets/preview.png">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RetroPlay — Vos jeux rétro en ligne">
  <meta name="twitter:description" content="Jouez gratuitement à vos jeux rétro préférés directement dans votre navigateur.">
  <meta name="twitter:image" content="https://noktissderune.github.io/retroplay-online/assets/preview.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      🎮 Retro<span>Play</span>
    </a>
  </header>

  <main>
    <!-- Bannière Jeu à la une (Hero Section) -->
    <section id="hero-section" class="hero-container">
      <!-- Injecté par JS -->
    </section>

<!-- Filtres et Recherche -->
<section class="controls-bar">
  <input type="text" id="search-input" class="search-input" placeholder="Rechercher un jeu (ex: Pokémon, Zelda)...">
  <div id="filters-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <button class="filter-btn active" data-console="all">Tous</button>
    <button class="filter-btn" data-console="favorites">❤️ Mes Favoris</button>
    <button class="filter-btn" data-console="gba">GBA</button>
    <button class="filter-btn" data-console="gb">GBC / GB</button>
    <button class="filter-btn" data-console="n64">N64</button>
  </div>
</section>

    <!-- Titre Catalogue -->
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 2rem 1rem;">
      <h2 class="section-title">Tout le catalogue</h2>
    </div>

    <!-- Grille Principale -->
    <section id="games-grid" class="games-grid">
      <!-- Injecté par JS -->
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
