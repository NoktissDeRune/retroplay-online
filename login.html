<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPlay — Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header injecté dynamiquement -->
  <div id="header-container"></div>

  <main>
    <div class="login-container">
      <h2 style="margin-bottom: 1.5rem; text-align: center; color: white;">Connexion</h2>
      
      <form id="login-form" class="login-form">
        <input type="email" id="email" class="login-input" placeholder="Ton email" required>
        <input type="password" id="password" class="login-input" placeholder="Ton mot de passe" required>
        <button type="submit" class="login-btn">Se connecter</button>
        <div id="error-msg"></div>
      </form>
      <div class="auth-link">
        Pas encore de compte ? <a href="register.html">S'inscrire</a>
      </div>
    </div>
  </main>

  <!-- Scripts Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>

  <!-- Script de gestion du Header dynamique -->
  <script src="js/components.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      errorDiv.textContent = 'Connexion en cours...';

      // Connexion via l'API Supabase Auth
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorDiv.textContent = 'Erreur : ' + error.message;
      } else {
        errorDiv.style.color = '#22c55e';
        errorDiv.textContent = 'Connexion réussie ! Redirection...';
        // Redirection vers l'accueil après connexion réussie
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }
    });
  </script>
</body>
</html>
